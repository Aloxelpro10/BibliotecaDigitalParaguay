<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis favoritos | Biblioteca Digital Paraguay</title>
  <link rel="stylesheet" href="static/css/styles.css">
</head>
<body class="favorites-page library-page-bg">
  <header class="site-header">
    <a class="brand" href="index.html">Biblioteca Digital Paraguay</a>
    <nav class="main-nav" aria-label="Navegacion principal">
      <a href="Inicio.html">Inicio</a>
      <a href="favoritos.html" aria-current="page">Favoritos</a>
    </nav>
  </header>

  <main class="favorites-layout">
    <section class="favorites-header">
      <div>
        <p class="eyebrow">Colección personal</p>
        <h1>Mis favoritos</h1>
      </div>
      <div class="favorites-summary">
        <span class="summary-number" id="favorites-count">0</span>
        <span>libros guardados</span>
      </div>
    </section>

    <div class="favorites-toolbar">
      <a class="secondary-button" href="Inicio.html">Volver al Inicio</a>
      <button type="button" class="clear-button" id="toggle-favorite-selection">Eliminar de favoritos</button>
      <label class="favorite-select-all" id="select-all-wrapper" hidden>
        <input id="select-all-favorites" type="checkbox">
        <span>Seleccionar todo</span>
      </label>
      <button type="button" class="clear-button" id="delete-selected-favorites" hidden>Eliminar</button>
    </div>

    <section id="favorites-list" class="favorites-list" aria-live="polite"></section>
  </main>

  <div id="favorites-confirm-modal" class="favorites-confirm-modal" hidden>
    <div class="favorites-confirm-backdrop" data-close-modal="true"></div>
    <div class="favorites-confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="favorites-confirm-title">
      <h2 id="favorites-confirm-title">Confirmación</h2>
      <p id="favorites-confirm-message">¿Estas seguro?</p>
      <div class="favorites-confirm-actions">
        <button type="button" class="secondary-button" id="favorites-confirm-cancel">Cancelar</button>
        <button type="button" class="clear-button" id="favorites-confirm-accept">Aceptar</button>
      </div>
    </div>
  </div>

  <script src="static/js/favoritos.js"></script>
</body>
</html>
